<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Mappealo — Asistente Geoespacial de Puerto Rico</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root{
    --brand:#0b5d4b; --brand-ink:#083f34; --accent:#0d9488;
    --bg:#eaeee9; --surface:#ffffff; --surface-2:#f5f7f4;
    --ink:#1a2420; --muted:#6b7770; --line:#e2e7e2;
    --ok:#137a4b; --ok-bg:#e3f3ea; --warn:#9a6a12; --warn-bg:#f8efd9; --low:#8a8f8b; --low-bg:#eeefee;
    --shadow:0 1px 2px rgba(20,40,34,.05), 0 6px 18px rgba(20,40,34,.06);
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}

  .topbar{display:flex;align-items:center;gap:12px;background:var(--brand);color:#fff;padding:12px 22px}
  .topbar .brand{font-weight:700;font-size:19px;letter-spacing:.02em}
  .topbar .tag{font-size:13px;opacity:.85}
  .langtog{margin-left:auto;display:flex;gap:2px;background:rgba(255,255,255,.15);border-radius:999px;padding:2px}
  .langtog a{cursor:pointer;font-size:12px;font-weight:600;color:#fff;padding:3px 11px;border-radius:999px;opacity:.85}
  .langtog a.on{background:#fff;color:var(--brand);opacity:1}

  main{display:grid;grid-template-columns:minmax(0,42%) minmax(0,58%);gap:14px;padding:14px;height:calc(100vh - 52px)}
  .panel{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}

  /* Chat */
  .chat{display:flex;flex-direction:column;min-height:0}
  .messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
  .empty{margin:auto;text-align:center;color:var(--muted);max-width:340px}
  .empty .icon{font-size:34px}
  .empty h3{margin:10px 0 6px;color:var(--ink);font-size:18px}
  .empty p{margin:0;font-size:13.5px;line-height:1.55}

  .row{display:flex}
  .row.user{justify-content:flex-end}
  .row.bot{justify-content:flex-start}
  .bubble{max-width:86%;padding:11px 14px;border-radius:16px;line-height:1.5;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
  .row.user .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:4px}
  .row.bot .bubble{background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .who{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .badge{font-size:10.5px;font-weight:700;text-transform:none;letter-spacing:0;padding:1px 8px;border-radius:999px}
  .badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.low{background:var(--low-bg);color:var(--low)}
  .cites{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .cites-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .cite{font-size:12.5px;margin:3px 0}
  .cite a{color:var(--brand);text-decoration:none}
  .cite a:hover{text-decoration:underline}
  .layers{margin-top:8px}
  .tag{display:inline-block;background:#e3eee9;color:var(--brand);padding:2px 9px;border-radius:999px;font-size:11.5px;margin:2px 4px 0 0}
  .typing{color:var(--muted);font-style:italic}

  /* Composer */
  .composer{border-top:1px solid var(--line);padding:12px 14px;background:var(--surface)}
  .samples{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .samples a{font-size:12px;color:var(--brand);background:var(--surface-2);border:1px solid var(--line);padding:3px 10px;border-radius:999px;cursor:pointer}
  .samples a:hover{background:#e3eee9}
  .inputrow{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;height:46px;max-height:120px;padding:12px 14px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:12px;resize:none;outline:none}
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
  #go{background:var(--brand);color:#fff;border:0;width:46px;height:46px;border-radius:12px;cursor:pointer;font-size:18px;flex:0 0 auto}
  #go:hover{background:var(--brand-ink)} #go:disabled{opacity:.5;cursor:default}
  .composer-meta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px}
  #clear{cursor:pointer;color:var(--muted);text-decoration:underline}
  .locchip{display:none;background:var(--accent);color:#fff;padding:3px 10px;border-radius:999px;font-size:12px}
  .locchip .x{cursor:pointer;margin-left:8px;font-weight:bold}
  .askbtn{background:var(--brand);color:#fff;border:0;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;font-family:inherit}
  .askbtn:hover{background:var(--brand-ink)}
  .maplibregl-popup-content{border-radius:10px;padding:12px 14px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
  .disc{font-size:11px;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line);background:var(--surface-2)}

  /* Map */
  .mappanel{display:flex;flex-direction:column}
  #layerctl{padding:12px 14px;max-height:300px;overflow:auto;border-bottom:1px solid var(--line);background:var(--surface)}
  #layerctl .h{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
  /* Layer panel: search + active list + catalog (no toggles) */
  .lyr-search{margin-bottom:8px}
  .lyr-search input{width:100%;padding:7px 10px;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;outline:none;background:var(--surface-2)}
  .lyr-search input:focus{border-color:var(--accent);background:#fff}
  .lyr-sec{margin-bottom:6px}
  .lyr-sec-h{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:9px 2px 4px}
  .lyr-sec-h a{cursor:pointer;text-transform:none;letter-spacing:0;font-size:11px;font-weight:600;color:var(--brand);text-decoration:underline}
  .lyr-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;transition:background .12s}
  .lyr-item:hover{background:var(--surface-2)}
  .lyr-item.on{background:#eef5f2;cursor:default}
  .lyr-item .swatch{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .lyr-item .swatch.off{background:transparent;border:2px solid var(--line)}
  .lyr-name{flex:1;font-size:12.5px;line-height:1.3;min-width:0}
  .lyr-name .yr{color:var(--muted)}
  .lyr-btn{flex:0 0 auto;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:6px;cursor:pointer;font-size:15px;font-family:inherit;color:var(--muted)}
  .lyr-item:hover .lyr-btn.add{background:var(--accent);color:#fff}
  .lyr-btn.rm{font-size:12px}
  .lyr-btn.rm:hover{background:#fde8e8;color:#c53030}
  .lyr-item .op{flex:0 0 54px;width:54px;height:3px;accent-color:var(--accent);cursor:pointer}
  .lyr-none{font-size:12px;color:var(--muted);padding:8px 4px;font-style:italic}
  .lyr-item.loading{opacity:.65;pointer-events:none}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #map{flex:1;min-height:320px}

  @media(max-width:820px){ main{grid-template-columns:1fr;height:auto} #map{height:60vh} }
</style>
</head>
<body>
<div class="topbar"><span class="brand" translate="no">🗺️ Mappealo</span><span class="tag">Asistente de planificación y riesgos de Puerto Rico</span><span class="langtog"><a id="lang-es">ES</a><a id="lang-en">EN</a></span></div>
<main>
  <section class="panel chat">
    <div id="out" class="messages"></div>
    <div class="composer">
      <div class="samples">
        <a data-q="¿Puedo construir en una zona inundable?">Zona inundable</a>
        <a data-q="¿Qué regula el Reglamento Conjunto?">Permisos</a>
        <a data-q="¿Cuántas escuelas hay en Adjuntas?">Escuelas</a>
        <a data-q="¿Dónde hay riesgo de deslizamiento?">Deslizamientos</a>
        <a data-q="¿Cómo se protegen los humedales?">Humedales</a>
      </div>
      <div class="inputrow">
        <textarea id="q" placeholder="Escribe tu pregunta… o haz clic en el mapa"></textarea>
        <button id="go" title="Preguntar">➤</button>
      </div>
      <div class="composer-meta">
        <a id="clear">Nueva conversación</a>
        <span id="loc" class="locchip"></span>
      </div>
    </div>
    <div class="disc" id="disc"></div>
  </section>
  <section class="panel mappanel">
    <div id="layerctl"><div class="h">Capas del mapa</div><div id="layerlist">Cargando capas…</div></div>
    <div id="map"></div>
  </section>
</main>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="/static/app.js?v=24"></script>
</body>
</html>
