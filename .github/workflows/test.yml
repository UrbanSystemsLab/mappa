# Tests run on every push and every pull request, and the deploy workflow waits
# for this one. Before it existed, a bad commit reached production unimpeded -
# an edit that deleted eighteen functions shipped, and the page still rendered,
# because nothing checked that the page still worked.

name: Tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_call:          # so deploy.yml can require it

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ruff
      # Unused imports, shadowed names, mutable defaults, silent zip truncation.
      # A variable shadowing a function is what once froze the chat on
      # "Consultando…" with no error anywhere.
      - run: ruff check api pipelines tests core
      - run: ruff format --check api pipelines tests core

  unit:
    needs: lint
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-api.txt pytest
      - name: Unit tests
        run: pytest tests/unit -q

  schema:
    name: Database builds from scratch
    runs-on: ubuntu-latest
    # The data tests need the real data and run against staging, in
    # scripts/release.sh. They used to run here against an empty database,
    # which meant this job could never pass and its failure meant nothing.
    # What an empty database can check is that the schema is reproducible.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mappa_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-api.txt
      - name: pgvector
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          docker exec $(docker ps -q --filter ancestor=postgis/postgis:16-3.4) \
            sh -c "apt-get update -qq && apt-get install -y -qq postgresql-16-pgvector"
      - name: Every migration applies to an empty database, and rolls back
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/mappa_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend-shape:
    name: Frontend integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: JavaScript parses
        run: node --check frontend/app.js
      - name: Every expected function still exists
        # An edit bounded by the wrong landmark deleted eighteen of these, and the
        # page still rendered because the welcome screen comes from HTML.
        run: |
          missing=0
          for fn in ask askHere render renderLayerPanel addLayer removeLayer \
                    restyle autoShowLayers focusBBox fetchLayers layerRow \
                    renderLegend showPopup featureCard applyLang; do
            grep -q "function $fn" frontend/app.js || { echo "MISSING: $fn"; missing=1; }
          done
          exit $missing
