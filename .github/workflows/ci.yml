# Tests on every pull request and push. A passing push to main deploys to
# staging; a passing push to release deploys the same build to production.
# `ci-ok` is the one check to require in branch protection.
#
# Deploys need a deploy key in the GitHub environment (docs/RELEASING.md) and
# the repository variable DEPLOY_ENABLED=true. Until then they are skipped and
# releases run from scripts/release.sh on a laptop.

name: CI

on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ruff
      # Unused imports, shadowed names, mutable defaults, silent zip truncation.
      - run: ruff check api pipelines tests core
      - run: ruff format --check api pipelines tests core

  unit:
    needs: lint
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-api.txt pytest
      - name: Unit tests
        run: pytest tests/unit -q

  schema:
    name: Database builds from scratch
    runs-on: ubuntu-latest
    # The data tests need the real data and run against staging, in
    # scripts/release.sh. An empty database can check that the schema builds
    # from the migrations alone, and rolls back.
    services:
      postgres:
        # pgvector's image runs current Debian, so PostGIS installs from the
        # PostgreSQL apt repository; the postgis image's Debian is no longer served.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mappa_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-api.txt "$(grep '^alembic==' requirements.txt)"
      - name: PostGIS
        run: |
          docker exec $(docker ps -q --filter ancestor=pgvector/pgvector:pg16) \
            sh -c "apt-get update -qq && apt-get install -y -qq postgresql-16-postgis-3"
      - name: Every migration applies to an empty database, and rolls back
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/mappa_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend-shape:
    name: Frontend integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: JavaScript parses
        run: node --check frontend/app.js
      - name: Every expected function still exists
        # The page renders its welcome screen from HTML even when these are gone,
        # so their absence would not show without this check.
        run: |
          missing=0
          for fn in ask askHere render renderLayerPanel addLayer removeLayer \
                    restyle autoShowLayers focusBBox fetchLayers layerRow \
                    renderLegend showPopup featureCard applyLang showFound; do
            grep -q "function $fn" frontend/app.js || { echo "MISSING: $fn"; missing=1; }
          done
          exit $missing

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, unit, schema, frontend-shape]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' >/dev/null

  deploy-staging:
    needs: ci-ok
    if: github.event_name == 'push' && github.ref_name == 'main' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
    secrets: inherit

  deploy-production:
    needs: ci-ok
    if: github.event_name == 'push' && github.ref_name == 'release' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
    secrets: inherit
